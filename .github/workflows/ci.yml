name: CI
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: [self-hosted, espoo]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: uv run --group dev --with mcp==1.30.0 pytest -q tests
  harbor:
    runs-on: [self-hosted, espoo]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: docker ps -aq --filter label=com.docker.compose.project | xargs -r docker rm -f; docker network prune -f
      - run: SEED=0 uvx --from harbor==0.25.0 harbor run -y -p task -a oracle --job-name ci-oracle
      - run: SEED=0 uvx --from harbor==0.25.0 harbor run -y -p task -a nop --job-name ci-nop
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name, want in (("oracle", 1.0), ("nop", 0.0)):
              r = json.loads(next(Path("jobs").glob(f"ci-{name}/*/result.json")).read_text())
              got = (r.get("verifier_result") or {}).get("rewards", {}).get("reward")
              print(name, got, next(Path("jobs").glob(f"ci-{name}/*/verifier/test-stdout.txt")).read_text())
              assert got is not None and abs(got - want) <= 0.01, (name, got)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs
          path: jobs/*/*/verifier/test-stdout.txt
      - if: always()
        run: docker system prune -af --volumes
