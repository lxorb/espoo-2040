schema_version = "1.4"
artifacts = [
    { source = "/var/lib/env/state.json", service = "mcp-server" },
]

[task]
name = "espoo/planner"
version = "0.1.0"
description = "Plan fifteen years of road, transit and pricing investment for Espoo to minimise total travel delay."

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 5400.0

[solution.env]
MODE = "${MODE:-full}"
REF = "${REF:-rl}"

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 6144

[environment.env]
SEED = "${SEED:-0}"
YEARS = "${YEARS:-15}"

[[environment.mcp_servers]]
name = "espoo"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
